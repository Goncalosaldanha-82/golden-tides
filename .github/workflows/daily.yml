name: Golden Tides daily

# Runs every hour (GitHub may delay scheduled runs by hours, and the free Hugging Face GPU quota renews on a
# rolling 24 h window). Each run: if tomorrow's 06:00 Lisbon release is not prepared yet, make the song and
# upload it scheduled for 06:00 (or publish at once if today was missed). Otherwise it stops in seconds.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: golden-tides-daily
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Anything to do? (stops here in seconds when the next release is already prepared)
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("Europe/Lisbon"))
          days = {d.get("publish_date") for d in json.load(open("gt_published.json")).values()}
          today = now.date().isoformat(); tomorrow = (now.date() + datetime.timedelta(days=1)).isoformat()
          todo = tomorrow not in days or (today not in days and now.hour < 12)
          print("todo=" + ("true" if todo else "false"))
          PY
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.todo == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries and fonts (cairo, Arial- and Georgia-compatible free fonts)
        if: steps.check.outputs.todo == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libcairo2-dev pkg-config fonts-liberation
          mkdir -p ~/.local/share/fonts
          curl -sSfL -o ~/.local/share/fonts/Gelasio.ttf "https://github.com/google/fonts/raw/main/ofl/gelasio/Gelasio%5Bwght%5D.ttf"
          fc-cache -f >/dev/null && fc-list | grep -i gelasio | head -1
      - run: pip install -r requirements.txt
        if: steps.check.outputs.todo == 'true'
      - name: Secrets (encrypted repository secrets)
        if: steps.check.outputs.todo == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GT_TOKEN_JSON: ${{ secrets.GT_TOKEN_JSON }}
        run: |
          printf '%s' "$HF_TOKEN" > hf_token.txt
          printf '%s' "$GT_TOKEN_JSON" > token_music.json
      - name: Make and upload today's song
        if: steps.check.outputs.todo == 'true'
        env:
          PYTHONIOENCODING: utf-8
          CINEMATIC_SERIF: Gelasio
          GT_WAIT_FOR_QUOTA: "1"
        run: python gt_daily.py
      - name: Save the release record in the repository
        if: always() && steps.check.outputs.todo == 'true'
        run: |
          rm -f hf_token.txt token_music.json
          git config user.name "golden-tides-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gt_published.json
          git diff --cached --quiet || (git commit -m "Release $(date -u +%F)" && git push)
